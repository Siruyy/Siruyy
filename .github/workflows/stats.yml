name: Update stats card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Render stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # STATS_TOKEN: classic PAT with repo + read:user, so private repos count.
          # Falls back to GITHUB_TOKEN (public data only) if the secret is missing.
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          path: profile/stats.svg
          fail_on_error: true
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&hide_border=true&count_private=true&include_all_commits=true&card_width=400&bg_color=0e0e0e&title_color=ff4b4b&icon_color=ff4b4b&text_color=d6d6d6&ring_color=ff4b4b

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update stats card [skip ci]"
          git push
