<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" xml:space="preserve" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" role="img" aria-label="Neovim buffer showing neel.lua: Neel Roda, AI/Software Engineer">
  <style>
    .t{fill:#d6d6d6}.k{fill:#ff4b4b}.s{fill:#f2a9a9}.n{fill:#ffb3b3}.c{fill:#5e5e5e;font-style:italic}.g{fill:#444444}.p{fill:#8a8a8a}
    .cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  </style>
  <rect width="920" height="330" rx="10" fill="#0e0e0e"/>

  <!-- tabline -->
  <rect x="0" y="0" width="920" height="30" fill="#141414"/>
  <rect x="0" y="0" width="180" height="30" fill="#0e0e0e"/>
  <rect x="0" y="28" width="180" height="2" fill="#ff4b4b"/>
  <text x="14" y="20" class="t">  neel.lua</text>
  <text x="194" y="20" class="p">  README.md</text>
  <text x="820" y="20" class="p" opacity="0.6">  1/2</text>

  <!-- gutter + buffer -->
  <g>
    <text x="26" y="58"  class="g" text-anchor="end">1</text><text x="44" y="58"  class="c">-- ~/.config/nvim/lua/neel.lua</text>
    <text x="26" y="80"  class="g" text-anchor="end">2</text><text x="44" y="80"><tspan class="k">local</tspan><tspan class="t"> neel = {</tspan></text>
    <text x="26" y="102" class="g" text-anchor="end">3</text><text x="44" y="102"><tspan class="t">  name     = </tspan><tspan class="s">"Neel Roda"</tspan><tspan class="t">,</tspan></text>
    <text x="26" y="124" class="g" text-anchor="end">4</text><text x="44" y="124"><tspan class="t">  role     = </tspan><tspan class="s">"AI/Software Engineer"</tspan><tspan class="t">,</tspan></text>
    <text x="26" y="146" class="g" text-anchor="end">5</text><text x="44" y="146"><tspan class="t">  stack    = { </tspan><tspan class="s">"Python"</tspan><tspan class="t">, </tspan><tspan class="s">"C#"</tspan><tspan class="t">, </tspan><tspan class="s">"C"</tspan><tspan class="t">, </tspan><tspan class="s">"Rust"</tspan><tspan class="t">, </tspan><tspan class="s">"Node.js"</tspan><tspan class="t">, </tspan><tspan class="s">"TypeScript"</tspan><tspan class="t">, </tspan><tspan class="s">"Next.js"</tspan><tspan class="t">, </tspan><tspan class="s">"Angular"</tspan><tspan class="t">, </tspan><tspan class="s">"Flutter"</tspan><tspan class="t"> },</tspan></text>
    <text x="26" y="168" class="g" text-anchor="end">6</text><text x="44" y="168"><tspan class="t">  learning = { </tspan><tspan class="s">"machine learning"</tspan><tspan class="t">, </tspan><tspan class="s">"cybersecurity"</tspan><tspan class="t"> },</tspan></text>
    <text x="26" y="190" class="g" text-anchor="end">7</text><text x="44" y="190"><tspan class="t">  homelab  = </tspan><tspan class="k">nil</tspan><tspan class="t">, </tspan><tspan class="c">-- RIP. rebuilding.</tspan></text>
    <text x="26" y="212" class="g" text-anchor="end">8</text><text x="44" y="212"><tspan class="t">  editor   = </tspan><tspan class="s">"neovim"</tspan><tspan class="t">, </tspan><tspan class="c">-- obviously</tspan></text>
    <text x="26" y="234" class="g" text-anchor="end">9</text><text x="44" y="234"><tspan class="t">  uptime   = </tspan><tspan class="s">"{{UPTIME}}"</tspan><tspan class="t">, </tspan><tspan class="c">-- no LTS release yet</tspan></text>
    <text x="26" y="256" class="g" text-anchor="end">10</text><text x="44" y="256" class="t">}</text>
    <text x="26" y="278" class="g" text-anchor="end">11</text><text x="44" y="278"><tspan class="k">return</tspan><tspan class="t"> neel</tspan></text>
    <rect x="137" y="265" width="9" height="17" fill="#ff4b4b" class="cur"/>
  </g>

  <!-- statusline -->
  <rect x="0" y="300" width="920" height="30" fill="#181818"/>
  <rect x="0" y="300" width="92" height="30" fill="#ff4b4b"/>
  <text x="16" y="320" fill="#0e0e0e" font-weight="700">NORMAL</text>
  <text x="104" y="320" class="p">  main   neel.lua</text>
  <text x="640" y="320" class="p">lua  utf-8</text>
  <rect x="740" y="300" width="180" height="30" fill="#2a2a2a"/>
  <text x="756" y="320" class="t">11:12   100%  11/11</text>
</svg>
